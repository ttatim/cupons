name: PHP 8.3+ compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

concurrency:
  group: php-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: cupons_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_NAME: cupons_test
      DB_USER: root
      DB_PASS: testpass
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, json, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Check runtime requirements
        run: php scripts/check_runtime.php
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -type f -name '*.php' -print0)
          exit "$status"
      - name: Runtime unit tests
        run: php tests/test_runtime_requirements.php
      - name: Importer unit tests
        run: php tests/test_offer_importer.php
      - name: Affiliate integrations unit tests
        run: php tests/test_affiliate_integrations.php
      - name: Hotmart commissions preview unit tests
        run: php tests/test_hotmart_commission_preview.php
      - name: Hotmart UCODE-matched commission preview tests
        run: php tests/test_hotmart_commission_account_preview.php
      - name: Hotmart commission staging validation tests
        run: php tests/test_hotmart_commission_staging.php
      - name: Hotmart staging pagination tests
        run: php tests/test_hotmart_commission_stage_pagination.php
      - name: Kiwify integration unit tests
        run: php tests/test_kiwify_integration.php
      - name: Monetizze authentication unit tests
        run: php tests/test_monetizze_integration.php
      - name: Monetizze webhook review unit tests
        run: php tests/test_monetizze_webhook_review.php
      - name: Clean install and storefront smoke test
        run: php tests/test_clean_install.php
      - name: Provision initial administrator through CLI
        env:
          ADMIN_USERNAME: admin_ci
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CI-testing-only-password-12345
        run: php scripts/create_admin.php
