name: PHP item 01 validation

on:
  push:
    branches:
      - main
      - feat/item-01-importacao-segura-20261024
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: cupons_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_NAME: cupons_test
      DB_USER: root
      DB_PASS: testpass
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring, pdo_mysql
          coverage: none
      - name: Lint changed PHP entrypoints
        run: |
          php -l includes/offer_metadata_importer.php
          php -l admin/importar.php
          php -l go.php
          php -l index.php
          php -l tests/test_offer_importer.php
          php -l includes/config.php
          php -l includes/database.php
          php -l includes/auth.php
          php -l admin/login.php
          php -l admin/lojas.php
          php -l admin/includes/sidebar.php
          php -l scripts/create_admin.php
          php -l tests/test_clean_install.php
      - name: Importer unit tests
        run: php tests/test_offer_importer.php
      - name: Clean install and storefront smoke test
        run: php tests/test_clean_install.php
      - name: Provision initial administrator through CLI
        env:
          ADMIN_USERNAME: admin_ci
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CI-testing-only-password-12345
        run: php scripts/create_admin.php
